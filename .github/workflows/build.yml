# Chioccia — compila il plug-in su GitHub.
# Ogni volta che carichi delle modifiche compila la versione Windows (Visual Studio 2022).
# macOS e Linux si compilano solo a richiesta: Azioni → build → "Run workflow" → spunta la casella.
# Il risultato si scarica da: Azioni → la run → "Artifacts".
name: build

on:
  push:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Compila anche macOS e Linux"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_platforms && '["windows-2022","macos-15","ubuntu-24.04"]' || '["windows-2022"]') }}

    steps:
      - uses: actions/checkout@v6

      # Trova il progetto completo. Se nel repository mancano dei file (caricamento via web
      # incompleto) usa uno zip del sorgente presente nel repository.
      - name: Locate project
        shell: bash
        run: |
          need="CMakeLists.txt assets/fonts/LilitaOne-Regular.ttf
            source/dsp/Biquad.h source/dsp/ColourStage.cpp source/dsp/ColourStage.h source/dsp/DelayLine.h
            source/dsp/Detector.cpp source/dsp/Detector.h source/dsp/DspCommon.h source/dsp/EngineParameters.h
            source/dsp/HalfBandOversampler.cpp source/dsp/HalfBandOversampler.h source/dsp/OpticalCell.cpp
            source/dsp/OpticalCell.h source/dsp/OptoEngine.cpp source/dsp/OptoEngine.h source/dsp/Smoothers.h
            source/gui/AdvancedPanel.cpp source/gui/AdvancedPanel.h source/gui/ChiocciaLookAndFeel.cpp
            source/gui/ChiocciaLookAndFeel.h source/gui/Controls.cpp source/gui/Controls.h source/gui/FacePlate.cpp
            source/gui/FacePlate.h source/gui/Layout.h source/gui/VuMeter.cpp source/gui/VuMeter.h
            source/plugin/Parameters.cpp source/plugin/Parameters.h source/plugin/PluginEditor.cpp
            source/plugin/PluginEditor.h source/plugin/PluginProcessor.cpp source/plugin/PluginProcessor.h
            source/plugin/Presets.cpp source/plugin/Presets.h"
          complete() { local ok=0; for f in $need; do [ -f "$1/$f" ] || { echo "  manca: $f"; ok=1; }; done; return $ok; }
          candidates() { grep -rl --include=CMakeLists.txt "project(Chioccia" "$1" 2>/dev/null | while IFS= read -r f; do dirname "$f"; done || true; }

          proj=""
          while IFS= read -r c; do
            echo "Controllo $c"; if complete "$c"; then proj="$c"; break; fi
          done < <(candidates .)
          if [ -z "$proj" ]; then
            echo "File mancanti nel repository: cerco uno zip del sorgente"
            i=0
            while IFS= read -r -d '' z; do
              i=$((i+1)); dest="_zip/$i"; mkdir -p "$dest"
              echo "Estraggo: $z"
              if command -v 7z >/dev/null; then 7z x -y -o"$dest" "$z" >/dev/null; else unzip -q -o "$z" -d "$dest"; fi
              while IFS= read -r c; do
                echo "Controllo $c"; if complete "$c"; then proj="$c"; break; fi
              done < <(candidates "$dest")
              [ -n "$proj" ] && break
            done < <(find . -name '*.zip' -not -path './.git/*' -not -path './_zip/*' -print0)
          fi
          if [ -z "$proj" ]; then
            echo "::error::Progetto incompleto: carica di nuovo le cartelle source, assets e tests (o lo zip del sorgente)"
            exit 1
          fi
          echo "PROJ=$proj" >> "$GITHUB_ENV"
          echo "Progetto in: $proj"
          # I test sono facoltativi: se mancano si compila solo il plug-in.
          if [ -f "$proj/tests/core/CoreTests.cpp" ] && [ -f "$proj/tests/plugin/PluginTests.cpp" ] && [ -f "$proj/tools/measure/Measure.cpp" ]; then
            echo "TESTS=ON" >> "$GITHUB_ENV"
          else
            echo "::warning::Cartella tests (o tools) mancante: compilo solo il plug-in, senza test automatici"
            echo "TESTS=OFF" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libfreetype-dev \
            libfontconfig1-dev libegl-dev xvfb

      - name: Configure
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cmake -S "$PROJ" -B build -DCHIOCCIA_BUILD_TESTS=$TESTS -G "Visual Studio 17 2022" -A x64 ;;
            macOS)   cmake -S "$PROJ" -B build -DCHIOCCIA_BUILD_TESTS=$TESTS -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 ;;
            Linux)   cmake -S "$PROJ" -B build -DCHIOCCIA_BUILD_TESTS=$TESTS -G Ninja -DCMAKE_BUILD_TYPE=Release ;;
          esac

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          ART=build/Chioccia_artefacts/Release
          mkdir -p dist
          cp "$PROJ/README.md" "$PROJ/assets/fonts/OFL-LilitaOne.txt" dist/
          case "$RUNNER_OS" in
            Windows) NAME=Chioccia-0.1.0-Windows-x64
                     cp -R "$ART/VST3/Chioccia.vst3" dist/ ;;
            macOS)   NAME=Chioccia-0.1.0-macOS-universal
                     cp -R "$ART/VST3/Chioccia.vst3" "$ART/AU/Chioccia.component" dist/
                     # zip interno per conservare i permessi dei bundle macOS
                     ditto -c -k --sequesterRsrc dist "$NAME.zip" && rm -rf dist && mkdir dist && mv "$NAME.zip" dist/ ;;
            Linux)   NAME=Chioccia-0.1.0-Linux-x64
                     cp -R "$ART/VST3/Chioccia.vst3" dist/ ;;
          esac
          echo "ART_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload plug-in
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ART_NAME }}
          path: dist
          if-no-files-found: error

      - name: Tests
        if: env.TESTS == 'ON'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_${RUNNER_OS}.zip"
          7z x -y pluginval.zip > /dev/null
          VST3="build/Chioccia_artefacts/Release/VST3/Chioccia.vst3"
          case "$RUNNER_OS" in
            Windows) ./pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3" ;;
            macOS)   ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3" ;;
            Linux)   chmod +x pluginval && xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3" ;;
          esac

      - name: auval (Audio Unit)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Chioccia_artefacts/Release/AU/Chioccia.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -strict -v aufx Chcc Plla
