# Chioccia — compila il plug-in su GitHub.
# Ogni volta che carichi delle modifiche compila la versione Windows (Visual Studio 2022).
# macOS e Linux si compilano solo a richiesta: Azioni → build → "Run workflow" → spunta la casella.
# Il risultato si scarica da: Azioni → la run → "Artifacts".
name: build

on:
  push:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Compila anche macOS e Linux"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_platforms && '["windows-2022","macos-15","ubuntu-24.04"]' || '["windows-2022"]') }}

    steps:
      - uses: actions/checkout@v6

      # Trova la cartella del progetto anche se è stata caricata dentro una sottocartella.
      - name: Locate project
        shell: bash
        run: |
          cml=$(grep -rl --include=CMakeLists.txt "project(Chioccia" . | head -n 1)
          if [ -z "$cml" ]; then echo "::error::CMakeLists.txt di Chioccia non trovato: carica i file estratti dallo zip"; exit 1; fi
          proj=$(dirname "$cml")
          echo "PROJ=$proj" >> "$GITHUB_ENV"
          echo "Progetto in: $proj"
          # I test sono facoltativi: se la cartella tests non è stata caricata si compila solo il plug-in.
          if [ -f "$proj/tests/core/CoreTests.cpp" ] && [ -f "$proj/tests/plugin/PluginTests.cpp" ] && [ -f "$proj/tools/measure/Measure.cpp" ]; then
            echo "TESTS=ON" >> "$GITHUB_ENV"
          else
            echo "::warning::Cartella tests (o tools) mancante: compilo solo il plug-in, senza test automatici"
            echo "TESTS=OFF" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev libfreetype-dev \
            libfontconfig1-dev libegl-dev xvfb

      - name: Configure
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cmake -S "$PROJ" -B build -DCHIOCCIA_BUILD_TESTS=$TESTS -G "Visual Studio 17 2022" -A x64 ;;
            macOS)   cmake -S "$PROJ" -B build -DCHIOCCIA_BUILD_TESTS=$TESTS -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 ;;
            Linux)   cmake -S "$PROJ" -B build -DCHIOCCIA_BUILD_TESTS=$TESTS -G Ninja -DCMAKE_BUILD_TYPE=Release ;;
          esac

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          ART=build/Chioccia_artefacts/Release
          mkdir -p dist
          cp "$PROJ/README.md" "$PROJ/assets/fonts/OFL-LilitaOne.txt" dist/
          case "$RUNNER_OS" in
            Windows) NAME=Chioccia-0.1.0-Windows-x64
                     cp -R "$ART/VST3/Chioccia.vst3" dist/ ;;
            macOS)   NAME=Chioccia-0.1.0-macOS-universal
                     cp -R "$ART/VST3/Chioccia.vst3" "$ART/AU/Chioccia.component" dist/
                     # zip interno per conservare i permessi dei bundle macOS
                     ditto -c -k --sequesterRsrc dist "$NAME.zip" && rm -rf dist && mkdir dist && mv "$NAME.zip" dist/ ;;
            Linux)   NAME=Chioccia-0.1.0-Linux-x64
                     cp -R "$ART/VST3/Chioccia.vst3" dist/ ;;
          esac
          echo "ART_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload plug-in
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ART_NAME }}
          path: dist
          if-no-files-found: error

      - name: Tests
        if: env.TESTS == 'ON'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_${RUNNER_OS}.zip"
          7z x -y pluginval.zip > /dev/null
          VST3="build/Chioccia_artefacts/Release/VST3/Chioccia.vst3"
          case "$RUNNER_OS" in
            Windows) ./pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3" ;;
            macOS)   ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3" ;;
            Linux)   chmod +x pluginval && xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process --output-dir pluginval-logs --validate "$VST3" ;;
          esac

      - name: auval (Audio Unit)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Chioccia_artefacts/Release/AU/Chioccia.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 5
          auval -strict -v aufx Chcc Plla
